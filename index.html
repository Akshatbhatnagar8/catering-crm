<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>The Chowk - Weddings & Events</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--muted:#777;--accent:#b8541a;--warn:#c0392b;--ok:#2e7d32;--border:#e3e0d8}
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0;flex:1}
button{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
button.danger{background:var(--warn)}
.board{display:flex;gap:12px;padding:16px;overflow-x:auto;min-height:calc(100vh - 60px)}
.col{background:#efece4;border-radius:10px;padding:10px;min-width:260px;width:260px;flex-shrink:0}
.col h3{margin:4px 6px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#555;display:flex;justify-content:space-between}
.col h3 span{background:#fff;border-radius:10px;padding:1px 8px;font-size:11px;color:#666}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.card:hover{border-color:var(--accent)}
.card .name{font-weight:600;margin-bottom:4px}
.card .meta{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;margin-top:6px}
.card.stale{border-left:4px solid var(--warn)}
.card.due{border-left:4px solid #e6a700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.dialog{background:#fff;border-radius:10px;width:560px;max-width:95vw;max-height:92vh;overflow-y:auto;padding:20px}
.dialog h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:#555;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:10px}
.row>div{flex:1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:14px 0 10px}
.tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;color:#666}
.tab.active{border-color:var(--accent);color:var(--accent);font-weight:600}
.timeline{max-height:240px;overflow-y:auto}
.entry{border-left:2px solid var(--border);padding:6px 10px;margin-left:6px;font-size:13px}
.entry .when{color:var(--muted);font-size:11px}
.alerts{background:#fff5e6;border:1px solid #f0c97d;padding:10px 14px;margin:10px 16px 0;border-radius:8px;font-size:13px}
.alerts b{color:var(--warn)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;background:#eee;color:#555;margin-left:4px}
</style>
</head>
<body>
<header>
<a href="/home.html" style="color:#b8541a;text-decoration:none;font-size:20px;margin-right:4px" title="Home">⌂</a>
<h1 style="font-size:16px;flex:1">💍 Weddings & Events</h1>
<div style="display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-right:6px">
  <button id="vPipeline" style="background:var(--accent);color:#fff;border:0;padding:6px 12px;font-size:12px;cursor:pointer;border-radius:0" onclick="setView('pipeline')">Pipeline</button>
  <button id="vMonthly" style="background:#fff;color:#555;border:0;padding:6px 12px;font-size:12px;cursor:pointer;border-radius:0" onclick="setView('monthly')">Monthly</button>
  <button id="vDeposits" style="background:#fff;color:#555;border:0;border-left:1px solid var(--border);padding:6px 12px;font-size:12px;cursor:pointer;border-radius:0" onclick="setView('deposits')">Deposits</button>
</div>
<button onclick="openClient()">+ New Client</button>
<button class="ghost" onclick="exportData()">Export</button>
<button class="ghost" onclick="document.getElementById('imp').click()">Import</button>
<input type="file" id="imp" style="display:none" accept=".json" onchange="importData(event)"/>
</header>

<div id="alertBox"></div>
<div id="summaryBar" style="padding:4px 20px 0;font-size:12px;color:#555;display:none;gap:16px"></div>
<div class="board" id="board"></div>

<div class="modal" id="modal"><div class="dialog" id="dialogBody"></div></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPA_URL="https://lvcioeljvwahvsulgilt.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2Y2lvZWxqdndhaHZzdWxnaWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDU4MjIsImV4cCI6MjA5MTEyMTgyMn0.RnOOCg3x-ltDU3H-yME5g8Vd6XCHILXqqFjyWDD1AJs";
const sb=createClient(SUPA_URL,SUPA_KEY);

const STAGES=["Lead from Agent","Tasting Scheduled","Tasting Completed","Sample Menu Sent","Menu Finalization","Awaiting Confirmation","Confirmed","Lost","Completed"];
const EVENT_TYPES=["Haldi","Mehendi","After Party","Wedding","Sadhya Dinner","High Tea","Breakfast","Lunch","Other"];
function migrateClient(c){
  if(!c.events)c.events=[];
  if(c.eventDate&&!c.events.length){
    c.events.push({id:uid(),type:"Other",date:c.eventDate,headcount:c.headcount||"",venue:c.venue||"",menu:c.menu||"",dietary:c.dietary||"",notes:""});
  }
  return c;
}
function fmtDate(d){if(!d)return "";const [y,m,day]=d.split("-");return day&&m&&y?`${day} ${m} ${y}`:d}
function eventSummary(c){
  const evs=(c.events||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!evs.length)return "";
  const dates=evs.filter(e=>e.date).map(e=>e.date);
  const first=dates[0],last=dates[dates.length-1];
  const range=first?(first===last?fmtDate(first):fmtDate(first)+" → "+fmtDate(last)):"";
  const types=evs.map(e=>e.type==="Other"&&e.customType?e.customType:e.type).filter(Boolean).join(", ");
  return {range,types,count:evs.length};
}
const SLA={"Lead from Agent":2,"Tasting Scheduled":1,"Tasting Completed":2,"Sample Menu Sent":3,"Menu Finalization":3,"Awaiting Confirmation":2,"Confirmed":999,"Lost":999,"Completed":999};

let data={clients:[]};
let editingId=null,activeTab="details";
let saveTimer=null;
let crmView="pipeline";
let monthOffset=0;
const dirty=new Set();
const deleted=new Set();

async function loadAll(){
  const {data:rows,error}=await sb.from("clients").select("data").order("updated_at",{ascending:false});
  if(error){alert("Load failed: "+error.message);return}
  data.clients=(rows||[]).map(r=>migrateClient(r.data));
  render();
}

async function flush(){
  const toUpsert=data.clients.filter(c=>dirty.has(c.id)).map(c=>({id:c.id,data:c}));
  dirty.clear();
  if(toUpsert.length){await sb.from("clients").upsert(toUpsert)}
  if(deleted.size){await sb.from("clients").delete().in("id",[...deleted]);deleted.clear()}
}

function save(id){
  if(id)dirty.add(id);
  else data.clients.forEach(c=>dirty.add(c.id));
  render();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,400);
}
window.addEventListener("beforeunload",flush);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function daysSince(d){if(!d)return 0;return Math.floor((Date.now()-new Date(d))/86400000)}

function setView(v){
  crmView=v;
  [["vPipeline","pipeline"],["vMonthly","monthly"],["vDeposits","deposits"]].forEach(([id,val])=>{
    const el=document.getElementById(id);if(!el)return;
    el.style.background=v===val?"var(--accent)":"#fff";
    el.style.color=v===val?"#fff":"#555";
  });
  render();
}
window.setView=setView;
window._shiftMonth=function(n){monthOffset=Math.max(0,monthOffset+n);render();};

function render(){
  const board=document.getElementById("board");board.innerHTML="";
  board.style.flexDirection="";board.style.flexWrap="";board.style.padding="";board.style.gap="";board.style.overflow="";
  const sb=document.getElementById("summaryBar");
  if(crmView==="monthly"){sb.style.display="none";renderMonthly(board);renderAlerts();return;}
  if(crmView==="deposits"){sb.style.display="none";renderDeposits(board);return;}
  // pipeline summary bar
  const active=data.clients.filter(c=>c.stage!=="Lost"&&c.stage!=="Completed");
  const pipelineVal=active.reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
  const confirmedVal=data.clients.filter(c=>c.stage==="Confirmed").reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
  const completedVal=data.clients.filter(c=>c.stage==="Completed").reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
  sb.style.display="flex";
  sb.innerHTML=`<span>Pipeline: <strong>IDR ${pipelineVal.toFixed(1)}mn</strong></span><span style="color:#2e7d32">Confirmed: <strong>IDR ${confirmedVal.toFixed(1)}mn</strong></span><span style="color:#1565c0">Completed: <strong>IDR ${completedVal.toFixed(1)}mn</strong></span>`;
  STAGES.forEach(s=>{
    const col=document.createElement("div");col.className="col";
    const list=data.clients.filter(c=>c.stage===s);
    col.innerHTML=`<h3>${s}<span>${list.length}</span></h3>`;
    list.forEach(c=>{
      const sla=SLA[s];const days=daysSince(c.stageSince);
      const overdue=days>sla;
      const nextDue=c.reminder&&c.reminder<=today();
      const cls="card"+(overdue?" stale":"")+(nextDue?" due":"");
      const div=document.createElement("div");div.className=cls;
      const summ=eventSummary(c);
      const totalPax=(c.events||[]).reduce((a,e)=>a+(parseInt(e.headcount)||0),0);
      div.innerHTML=`<div class="name">${c.name||"(no name)"}${c.estValue?`<span style="float:right;font-size:11px;font-weight:700;color:#2e7d32">IDR ${c.estValue}mn</span>`:""}</div>
        ${summ?`<div style="font-size:11px;color:#666">📅 ${summ.range} ${totalPax?"• "+totalPax+" pax":""}</div>
        <div style="font-size:11px;color:#888;margin-top:2px">${summ.count} event${summ.count>1?"s":""}: ${summ.types}</div>`:""}
        <div class="meta"><span>${c.agent||"—"}</span><span>${days}d in stage</span></div>
        ${c.reminder?`<div style="font-size:11px;margin-top:4px;color:${nextDue?'#c0392b':'#888'}">⏰ ${fmtDate(c.reminder)}</div>`:""}`;
      div.onclick=()=>openClient(c.id);
      col.appendChild(div);
    });
    board.appendChild(col);
  });
  renderAlerts();
}

function renderDeposits(board){
  board.style.flexDirection="column";board.style.flexWrap="nowrap";board.style.padding="16px 20px";board.style.gap="12px";board.style.overflow="auto";
  const confirmed=data.clients.filter(c=>c.stage==="Confirmed"||c.stage==="Completed")
    .slice().sort((a,b)=>{
      const da=(a.events||[]).map(e=>e.date).filter(Boolean).sort()[0]||"";
      const db=(b.events||[]).map(e=>e.date).filter(Boolean).sort()[0]||"";
      return da.localeCompare(db);
    });
  const totalVal=confirmed.reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
  const totalDep=confirmed.reduce((a,c)=>a+(parseFloat(c.deposit?.amount)||0),0);
  const outstanding=Math.max(0,totalVal-totalDep);
  const pills=document.createElement("div");
  pills.style.cssText="display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0";
  const mkPill=(label,val,color)=>`<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;color:#777;line-height:1.4"><span>${label}</span><div style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;color:${color}">${val}</div></div>`;
  pills.innerHTML=mkPill("Total Confirmed Value",`IDR ${totalVal.toFixed(1)}mn`,"#222")+mkPill("Deposits Received",`IDR ${totalDep.toFixed(1)}mn`,"var(--ok)")+mkPill("Outstanding",`IDR ${outstanding.toFixed(1)}mn`,"var(--warn)")+mkPill("Clients",confirmed.length,"#1565c0");
  board.appendChild(pills);
  if(!confirmed.length){
    const empty=document.createElement("div");empty.style.cssText="text-align:center;padding:40px;color:#aaa;font-size:13px";empty.textContent="No confirmed or completed events yet.";board.appendChild(empty);return;
  }
  const depStatus=(c)=>{
    const val=parseFloat(c.estValue)||0,dep=parseFloat(c.deposit?.amount)||0;
    if(dep<=0)return["Awaiting","#ffeaea","var(--warn)"];
    if(dep<val)return["Partial","#fff8e1","#b37700"];
    return["Paid in Full","#e8f5e9","var(--ok)"];
  };
  const wrap=document.createElement("div");wrap.style.cssText="overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:#fff;flex-shrink:0";
  const rows=confirmed.map(c=>{
    const val=parseFloat(c.estValue)||0,dep=parseFloat(c.deposit?.amount)||0,bal=val-dep;
    const [sl,sbg,sc]=depStatus(c);
    const evs=(c.events||[]).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const evText=evs.map(e=>`${e.type==="Other"&&e.customType?e.customType:e.type}${e.date?" · "+fmtDate(e.date):""}`).join("<br>");
    return `<tr>
      <td style="font-weight:600">${c.name||"(no name)"}<div style="font-size:10px;font-weight:400;margin-top:2px;color:${c.stage==="Completed"?"#1565c0":"var(--ok)"}">● ${c.stage}</div></td>
      <td style="font-size:12px;color:#777">${c.agent||"—"}</td>
      <td style="font-size:12px;line-height:1.7">${evText||"—"}</td>
      <td style="font-weight:600;font-variant-numeric:tabular-nums">${val?val.toFixed(1):"—"}</td>
      <td><input type="number" min="0" step="0.1" placeholder="0.0" value="${dep||""}" style="width:85px;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font-size:13px;font-variant-numeric:tabular-nums" data-cid="${c.id}" data-f="amount" oninput="window._depChange(this)"/></td>
      <td><input type="date" value="${c.deposit?.date||""}" style="width:130px;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font-size:12px" data-cid="${c.id}" data-f="date" oninput="window._depChange(this)"/></td>
      <td style="font-weight:700;font-variant-numeric:tabular-nums;color:${bal<=0?"var(--ok)":"var(--warn)"}">${val?(bal<=0?"✓":"IDR "+bal.toFixed(1)+"mn"):"—"}</td>
      <td><span style="display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;background:${sbg};color:${sc};text-transform:uppercase;letter-spacing:.04em">${sl}</span></td>
      <td><input type="text" placeholder="Note…" value="${(c.deposit?.note||"").replace(/"/g,"&quot;")}" style="width:150px;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font-size:12px;color:#777" data-cid="${c.id}" data-f="note" oninput="window._depChange(this)"/></td>
    </tr>`;
  }).join("");
  wrap.innerHTML=`<table style="border-collapse:collapse;width:100%;min-width:860px;font-size:13px">
    <thead><tr style="background:var(--bg)">${["Client","Agent","Events","Est. Value (mn)","Deposit Received (mn)","Deposit Date","Balance","Status","Notes"].map(h=>`<th style="padding:9px 13px;text-align:left;font-size:10px;font-weight:700;color:#999;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap">${h}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table>`;
  board.appendChild(wrap);
  let depTimer=null;
  window._depChange=(input)=>{
    const cid=input.dataset.cid,field=input.dataset.f;
    const c=data.clients.find(x=>x.id===cid);if(!c)return;
    if(!c.deposit)c.deposit={};
    c.deposit[field]=field==="amount"?(input.value===""?"":parseFloat(input.value)||0):input.value;
    dirty.add(cid);
    const tr=input.closest("tr");
    const val=parseFloat(c.estValue)||0,dep=parseFloat(c.deposit?.amount)||0,bal=val-dep;
    const balEl=tr.children[6];
    if(balEl){balEl.innerHTML=val?(bal<=0?"✓":"IDR "+bal.toFixed(1)+"mn"):"—";balEl.style.color=bal<=0?"var(--ok)":"var(--warn)";}
    const [nsl,nsbg,nsc]=depStatus(c);
    const pillEl=tr.querySelector("span[style]");if(pillEl){pillEl.textContent=nsl;pillEl.style.background=nsbg;pillEl.style.color=nsc;}
    clearTimeout(depTimer);depTimer=setTimeout(flush,500);
  };
}

function renderAlerts(){
  const stale=data.clients.filter(c=>daysSince(c.stageSince)>SLA[c.stage]&&c.stage!=="Confirmed"&&c.stage!=="Lost"&&c.stage!=="Completed");
  const dueRem=data.clients.filter(c=>c.reminder&&c.reminder<=today());
  const ab=document.getElementById("alertBox");
  if(stale.length||dueRem.length){
    ab.innerHTML=`<div class="alerts"><b>Attention:</b> ${dueRem.length} reminder(s) due today, ${stale.length} client(s) stale beyond stage SLA.</div>`;
  } else ab.innerHTML="";
}

function renderMonthly(board){
  const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const now=new Date();

  board.style.flexDirection="column";
  board.style.flexWrap="nowrap";
  board.style.padding="0";
  board.style.gap="0";
  board.style.overflow="hidden";

  // nav bar
  const startD=new Date(now.getFullYear(),now.getMonth()+monthOffset,1);
  const endD=new Date(now.getFullYear(),now.getMonth()+monthOffset+11,1);
  const nav=document.createElement("div");
  nav.style.cssText="display:flex;align-items:center;gap:10px;padding:12px 16px;flex-shrink:0;width:100%;border-bottom:1px solid #e3e0d8";
  const btnBack=document.createElement("button");btnBack.className="ghost";btnBack.style.cssText="padding:6px 14px;font-size:16px";btnBack.textContent="‹ Back";
  btnBack.addEventListener("click",()=>{monthOffset=Math.max(0,monthOffset-12);render();});
  const navLabel=document.createElement("span");navLabel.style.cssText="font-size:13px;color:#666;flex:1;text-align:center";
  navLabel.textContent=`${MONTHS[startD.getMonth()]} ${startD.getFullYear()} — ${MONTHS[endD.getMonth()]} ${endD.getFullYear()}`;
  const btnToday=document.createElement("button");btnToday.className="ghost";btnToday.style.cssText="padding:6px 10px;font-size:11px"+(monthOffset===0?";opacity:0.3;cursor:default":"");btnToday.textContent="Today";
  btnToday.addEventListener("click",()=>{if(monthOffset===0)return;monthOffset=0;render();});
  const btnFwd=document.createElement("button");btnFwd.className="ghost";btnFwd.style.cssText="padding:6px 14px;font-size:16px";btnFwd.textContent="Forward ›";
  btnFwd.addEventListener("click",()=>{monthOffset+=12;render();});
  nav.appendChild(btnBack);nav.appendChild(navLabel);nav.appendChild(btnToday);nav.appendChild(btnFwd);
  board.appendChild(nav);

  // inner scrollable row for columns
  const row=document.createElement("div");
  row.style.cssText="display:flex;gap:12px;padding:16px;overflow-x:auto;flex:1;align-items:flex-start";

  for(let i=0;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+monthOffset+i,1);
    const y=d.getFullYear(),m=d.getMonth();
    const key=`${y}-${String(m+1).padStart(2,"0")}`;
    const clients=data.clients.filter(c=>(c.events||[]).some(e=>e.date&&e.date.startsWith(key)));
    const totalVal=clients.reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
    const completedVal=clients.filter(c=>c.stage==="Completed").reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
    const confirmedVal=clients.filter(c=>c.stage==="Confirmed").reduce((a,c)=>a+(parseFloat(c.estValue)||0),0);
    const pipelineVal=totalVal-confirmedVal-completedVal;

    const TARGET=600;
    const completedPct=Math.min(100,completedVal/TARGET*100);
    const confirmedPct=Math.min(100-completedPct,confirmedVal/TARGET*100);
    const pipelinePct=Math.min(100-completedPct-confirmedPct,pipelineVal/TARGET*100);
    const overTarget=totalVal>TARGET;

    const col=document.createElement("div");col.className="col";col.style.minWidth="220px";col.style.width="220px";col.style.flexShrink="0";
    col.innerHTML=`<h3 style="flex-direction:column;align-items:flex-start;gap:4px">
      <span>${MONTHS[m]} ${y}</span>
      <div style="width:100%;height:8px;background:#e8e5de;border-radius:4px;overflow:hidden;display:flex">
        <div style="width:${completedPct}%;background:#1565c0;height:100%" title="Completed"></div>
        <div style="width:${confirmedPct}%;background:#2e7d32;height:100%" title="Confirmed"></div>
        <div style="width:${pipelinePct}%;background:#f9a825;height:100%" title="Pipeline"></div>
      </div>
      <span style="font-size:10px;font-weight:400;color:${overTarget?"#b71c1c":"#666"}">
        IDR ${totalVal.toFixed(0)}mn / 600mn${completedVal?` · <span style="color:#1565c0">${completedVal.toFixed(0)} done</span>`:""}${confirmedVal?` · <span style="color:#2e7d32">${confirmedVal.toFixed(0)} conf</span>`:""}
      </span>
    </h3>`;

    if(!clients.length){
      const empty=document.createElement("div");empty.style.cssText="font-size:12px;color:#bbb;padding:10px 4px";empty.textContent="No events";col.appendChild(empty);
    }
    clients.forEach(c=>{
      const evs=(c.events||[]).filter(e=>e.date&&e.date.startsWith(key)).map(e=>e.type==="Other"&&e.customType?e.customType:e.type).join(", ");
      const div=document.createElement("div");div.className="card";div.style.cursor="pointer";
      div.innerHTML=`<div class="name">${c.name||"(no name)"}${c.estValue?`<span style="float:right;font-size:11px;font-weight:700;color:#2e7d32">IDR ${c.estValue}mn</span>`:""}</div>
        <div style="font-size:11px;color:#888;margin-top:3px">${evs}</div>
        <div class="meta"><span style="color:#555">${c.stage}</span><span>${c.agent||"—"}</span></div>`;
      div.onclick=()=>openClient(c.id);
      col.appendChild(div);
    });
    row.appendChild(col);
  }
  board.appendChild(row);
}

function openClient(id){
  editingId=id||null;activeTab="details";
  const c=id?data.clients.find(x=>x.id===id):migrateClient({id:uid(),name:"",stage:STAGES[0],stageSince:today(),agent:"",phone:"",email:"",events:[],tastingNotes:"",reminder:"",reminderNote:"",estValue:"",log:[],files:[]});
  if(!id){data.clients.push(c);editingId=c.id;dirty.add(c.id)}
  renderDialog(c);
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show");flush();render()}
function deleteClient(id){data.clients=data.clients.filter(x=>x.id!==id);deleted.add(id);dirty.delete(id);closeModal()}

function renderDialog(c){
  const body=document.getElementById("dialogBody");
  body.innerHTML=`
    <h2>${c.name||"New Client"}</h2>
    <div class="tabs">
      <div class="tab ${activeTab==='details'?'active':''}" onclick="setTab('details')">Details</div>
      <div class="tab ${activeTab==='events'?'active':''}" onclick="setTab('events')">Events (${(c.events||[]).length})</div>
      <div class="tab ${activeTab==='menu'?'active':''}" onclick="setTab('menu')">Tasting</div>
      <div class="tab ${activeTab==='reminder'?'active':''}" onclick="setTab('reminder')">Reminder</div>
      <div class="tab ${activeTab==='files'?'active':''}" onclick="setTab('files')">Files (${(c.files||[]).length})</div>
      <div class="tab ${activeTab==='todo'?'active':''}" onclick="setTab('todo')">Todo</div>
      <div class="tab ${activeTab==='log'?'active':''}" onclick="setTab('log')">Activity (${(c.log||[]).length})</div>
    </div>
    <div id="tabContent"></div>
    <div class="actions">
      <button class="danger" onclick="if(confirm('Delete this client?'))deleteClient('${c.id}')">Delete</button>
      <button class="ghost" onclick="closeModal()">Close</button>
    </div>`;
  renderTab(c);
}
function setTab(t){activeTab=t;const c=data.clients.find(x=>x.id===editingId);renderDialog(c)}

function renderTab(c){
  const t=document.getElementById("tabContent");
  const upd=(f,v)=>{c[f]=v;if(f==='stage'){c.stageSince=today();c.log=c.log||[];c.log.unshift({when:new Date().toLocaleString(),text:"Moved to "+v})}save(c.id);if(f==='name')document.querySelector('#dialogBody h2').textContent=v||"New Client"};
  if(activeTab==='details'){
    t.innerHTML=`
      <label>Client name</label><input id="f_name" value="${c.name||''}"/>
      <div class="row"><div><label>Phone</label><input id="f_phone" value="${c.phone||''}"/></div>
      <div><label>Email</label><input id="f_email" value="${c.email||''}"/></div></div>
      <label>Agent / Referrer</label><input id="f_agent" value="${c.agent||''}"/>
      <div class="row"><div><label>Stage</label><select id="f_stage">${STAGES.map(s=>`<option ${s===c.stage?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Est. Value (mn)</label><input id="f_estValue" type="number" step="0.1" min="0" placeholder="e.g. 1.5" value="${c.estValue||''}"/></div></div>`;
    ['name','phone','email','agent','estValue'].forEach(f=>document.getElementById('f_'+f).oninput=e=>upd(f,e.target.value));
    document.getElementById('f_stage').onchange=e=>{upd('stage',e.target.value);renderTab(c)};
  }
  else if(activeTab==='events'){
    c.events=c.events||[];
    const list=c.events.map((e,i)=>`
      <div style="border:1px solid #e3e0d8;border-radius:8px;padding:10px;margin-bottom:10px;background:#fafaf7">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <select data-ev="${i}" data-f="type" style="flex:1">${EVENT_TYPES.map(et=>`<option ${et===e.type?'selected':''}>${et}</option>`).join('')}</select>
          ${e.type==="Other"?`<input data-ev="${i}" data-f="customType" placeholder="Enter event type…" value="${e.customType||''}" style="flex:1"/>`:""}
          <input type="date" data-ev="${i}" data-f="date" value="${e.date||''}" style="flex:1"/>
          <button class="danger" style="padding:4px 10px;font-size:12px" onclick="delEvent('${c.id}',${i})">×</button>
        </div>
        <div class="row"><div><label>Headcount</label><input data-ev="${i}" data-f="headcount" value="${e.headcount||''}"/></div>
        <div><label>Venue</label><input data-ev="${i}" data-f="venue" value="${e.venue||''}"/></div></div>
        <label>Dietary</label><input data-ev="${i}" data-f="dietary" value="${e.dietary||''}"/>
        <label>Menu</label><textarea data-ev="${i}" data-f="menu">${e.menu||''}</textarea>
        <label>Notes</label><textarea data-ev="${i}" data-f="notes">${e.notes||''}</textarea>
      </div>`).join('')||'<p style="color:#999;font-size:12px">No events yet.</p>';
    t.innerHTML=list+`<button onclick="addEvent('${c.id}')">+ Add event</button>`;
    t.querySelectorAll('[data-ev]').forEach(el=>{
      const i=+el.dataset.ev,f=el.dataset.f;
      const handler=e=>{c.events[i][f]=e.target.value;save(c.id);if(f==='type')renderDialog(c)};
      el.oninput=handler;el.onchange=handler;
    });
  }
  else if(activeTab==='menu'){
    t.innerHTML=`<label>Tasting notes (across all events)</label><textarea id="f_tastingNotes" style="min-height:120px">${c.tastingNotes||''}</textarea>`;
    document.getElementById('f_tastingNotes').oninput=e=>upd('tastingNotes',e.target.value);
  }
  else if(activeTab==='reminder'){
    const PEOPLE2=["","Pawan","Pooja","Arunabh","Akshat","Anahita","Mei","Bertha","Yuli","Vicky"];
    t.innerHTML=`<label>Next follow-up date</label><input type="date" id="f_reminder" value="${c.reminder||''}"/>
      <label>Assigned to</label><select id="f_reminderAssignee">${PEOPLE2.map(p=>`<option value="${p}" ${p===(c.reminderAssignee||'')?'selected':''}>${p||'— unassigned —'}</option>`).join('')}</select>
      <label>Reminder note</label><textarea id="f_reminderNote" placeholder="e.g. Call to confirm final menu and headcount">${c.reminderNote||''}</textarea>
      <p style="font-size:12px;color:#888">SLA for "${c.stage}" is ${SLA[c.stage]} days. Currently ${daysSince(c.stageSince)} days in stage. ${c.reminderAssignee?`<br>✓ This reminder auto-appears in <b>${c.reminderAssignee}</b>'s todo list.`:`<br>ℹ Assign to someone to push it to their todo list.`}</p>
      <button class="ghost" onclick="clearReminder('${c.id}')">Clear reminder</button>`;
    ['reminder','reminderNote','reminderAssignee'].forEach(f=>{
      const el=document.getElementById('f_'+f);
      const handler=e=>{upd(f,e.target.value);syncReminderTodo(c)};
      el.oninput=handler;el.onchange=handler;
    });
  }
  else if(activeTab==='files'){
    c.files=c.files||[];
    const list=c.files.map((f,i)=>{
      const url=sb.storage.from('client-files').getPublicUrl(f.path).data.publicUrl;
      const isPdf=/\.pdf$/i.test(f.name),isImg=/\.(png|jpe?g|gif|webp)$/i.test(f.name);
      const prev=isPdf?`<iframe src="${url}" style="width:100%;height:300px;border:1px solid #e3e0d8;border-radius:6px;margin-top:6px"></iframe>`:isImg?`<img src="${url}" style="max-width:100%;max-height:300px;border:1px solid #e3e0d8;border-radius:6px;margin-top:6px"/>`:'';
      return `<div style="border:1px solid #e3e0d8;border-radius:6px;padding:8px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis">📄 ${f.name} <span style="color:#888;font-size:11px">(${(f.size/1024).toFixed(0)} KB)</span></div>
          <a href="${url}" download="${f.name}" target="_blank"><button class="ghost" style="padding:4px 10px;font-size:12px">Download</button></a>
          <button class="danger" style="padding:4px 10px;font-size:12px" onclick="if(confirm('Delete ${f.name.replace(/'/g,"\\'")}?'))delFile('${c.id}',${i})">×</button>
        </div>${prev}</div>`;
    }).join('')||'<p style="color:#999;font-size:12px">No files yet.</p>';
    t.innerHTML=`<label>Upload file (max 25 MB)</label>
      <input type="file" id="f_upload"/>
      <p id="f_status" style="font-size:12px;color:#888;margin:6px 0"></p>
      <div style="margin-top:10px">${list}</div>`;
    document.getElementById('f_upload').onchange=e=>uploadFile(c.id,e.target.files[0]);
  }
  else if(activeTab==='todo'){
    const PEOPLE=["Pawan","Pooja","Arunabh","Akshat","Anahita","Mei","Bertha","Yuli","Vicky"];
    const CATS=["Kitchen","Front","Events","Catering","Sales","Marketing","HR","Accounting","Admin","Other"];
    t.innerHTML=`<p style="font-size:12px;color:#888;margin:0 0 8px">Create a todo linked to <b>${c.name||"this client"}</b> — it will appear in the assignee's column on the Todos page.</p>
      <label>Task</label><input id="td_text" placeholder="e.g. Call to confirm advance payment"/>
      <div class="row">
        <div><label>Assignee</label><select id="td_who">${PEOPLE.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div><label>Priority</label><select id="td_pri"><option value="high">High</option><option value="med" selected>Med</option><option value="low">Low</option></select></div>
      </div>
      <div class="row">
        <div><label>Category</label><select id="td_cat">${CATS.map(x=>`<option ${x==="Events"?"selected":""}>${x}</option>`).join('')}</select></div>
        <div><label>Due date</label><input type="date" id="td_due"/></div>
      </div>
      <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="td_rock" style="width:auto"/> ⭐ Big Rock</label>
      <div style="margin-top:10px"><button onclick="createClientTodo('${c.id}')">+ Create todo</button> <span id="td_status" style="font-size:12px;color:#2e7d32;margin-left:8px"></span></div>`;
  }
  else if(activeTab==='log'){
    t.innerHTML=`<label>Add note</label><div class="row"><div style="flex:3"><input id="f_newlog" placeholder="Called client, sent menu PDF..."/></div>
      <div style="flex:1"><button onclick="(()=>{const v=document.getElementById('f_newlog').value;if(!v)return;const c=data.clients.find(x=>x.id==='${c.id}');c.log=c.log||[];c.log.unshift({when:new Date().toLocaleString(),text:v});save(c.id);renderTab(c)})()">Add</button></div></div>
      <div class="timeline" style="margin-top:10px">${(c.log||[]).map(e=>`<div class="entry"><div class="when">${e.when}</div>${e.text}</div>`).join('')||'<p style="color:#999;font-size:12px">No activity yet.</p>'}</div>`;
  }
}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="catering-crm-"+today()+".json";a.click();
}
async function syncReminderTodo(c){
  const todoId="rem-"+c.id;
  if(!c.reminderAssignee||!c.reminder){
    await sb.from("todos").delete().eq("id",todoId);
    return;
  }
  const todo={
    id:todoId,assignee:c.reminderAssignee,
    text:(c.reminderNote||`Follow up with ${c.name||"client"}`),
    done:false,priority:"high",category:"Sales",
    due:c.reminder,bigRock:false,recurring:"",
    clientId:c.id,created:new Date().toISOString()
  };
  await sb.from("todos").upsert({id:todoId,data:todo});
}
async function clearReminder(clientId){
  const c=data.clients.find(x=>x.id===clientId);if(!c)return;
  c.reminder="";c.reminderNote="";c.reminderAssignee="";
  await sb.from("todos").delete().eq("id","rem-"+clientId);
  save(clientId);renderTab(c);
}

async function createClientTodo(clientId){
  const g=id=>document.getElementById(id);
  const text=g('td_text').value.trim();
  if(!text){g('td_status').textContent="Enter a task";g('td_status').style.color="#c0392b";return}
  const todo={
    id:uid(),assignee:g('td_who').value,text,done:false,
    priority:g('td_pri').value,category:g('td_cat').value,
    due:g('td_due').value||"",bigRock:g('td_rock').checked,
    recurring:"",clientId,created:new Date().toISOString()
  };
  const {error}=await sb.from("todos").upsert({id:todo.id,data:todo});
  if(error){g('td_status').textContent="Failed: "+error.message;g('td_status').style.color="#c0392b";return}
  g('td_status').textContent=`✓ Added to ${todo.assignee}`;g('td_status').style.color="#2e7d32";
  g('td_text').value="";g('td_due').value="";g('td_rock').checked=false;
}

function addEvent(clientId){
  const c=data.clients.find(x=>x.id===clientId);if(!c)return;
  c.events=c.events||[];
  c.events.push({id:uid(),type:"Wedding",date:"",headcount:"",venue:"",menu:"",dietary:"",notes:""});
  save(clientId);renderDialog(c);
}
function delEvent(clientId,idx){
  const c=data.clients.find(x=>x.id===clientId);if(!c||!c.events)return;
  c.events.splice(idx,1);save(clientId);renderDialog(c);
}

async function uploadFile(clientId,file){
  if(!file)return;
  if(file.size>25*1024*1024){alert("Max 25 MB");return}
  const c=data.clients.find(x=>x.id===clientId);if(!c)return;
  const status=document.getElementById('f_status');status.textContent="Uploading…";
  const path=`${clientId}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
  const {error}=await sb.storage.from('client-files').upload(path,file);
  if(error){status.textContent="Failed: "+error.message;return}
  c.files=c.files||[];c.files.push({name:file.name,path,size:file.size,uploaded:new Date().toISOString()});
  save(clientId);await flush();renderTab(c);
}
async function delFile(clientId,idx){
  const c=data.clients.find(x=>x.id===clientId);if(!c||!c.files)return;
  const f=c.files[idx];
  await sb.storage.from('client-files').remove([f.path]);
  c.files.splice(idx,1);save(clientId);await flush();renderTab(c);
}

function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);data.clients=j.clients||[];save()}catch(err){alert("Invalid file")}};r.readAsText(f);
}

Object.assign(window,{openClient,closeModal,setTab,exportData,importData,deleteClient,uploadFile,delFile,addEvent,delEvent,createClientTodo,syncReminderTodo,clearReminder,data});

  save();
}
render();
